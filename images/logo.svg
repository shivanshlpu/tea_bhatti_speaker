<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <!-- Solid Dark Background -->
  <rect width="500" height="200" fill="#0A0A0A" rx="12" />

  <g transform="translate(20, 20)">
    <!-- Red Top Header Bar over whole logo -->
    <rect x="20" y="32" width="420" height="12" fill="#E52521" />

    <!-- Left Logo Mark: "t" stem extending down -->
    <path d="M 20 32 L 60 32 L 60 140 Q 60 165 95 165 Q 120 165 125 145 L 105 145 Q 98 152 90 152 Q 78 152 78 135 L 78 32 Z" fill="#E52521" />

    <!-- "ea" nested inside/beside "t" in red -->
    <text x="75" y="112" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#E52521" letter-spacing="-2">ea</text>

    <!-- Right Side: Devanagari "भट्टी" in solid white -->
    <text x="180" y="125" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Yatra One', 'Arial', sans-serif" font-weight="900" font-size="86" fill="#FFFFFF">भट्टी</text>
  </g>
</svg>
